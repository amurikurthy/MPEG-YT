<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0f0f0f">
  <script>
    // Apply the saved theme before first paint (dark unless the viewer chose light).
    try { if (JSON.parse(localStorage.getItem('mpegyt.prefs') || '{}').theme === 'light') {
      document.documentElement.dataset.theme = 'light';
      document.querySelector('meta[name=color-scheme]').content = 'light';
    } } catch (e) {}
  </script>
  <!-- Installable to the tablet home screen: opens without browser chrome. -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MPEG-YT">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <link rel="preconnect" href="https://i.ytimg.com">
  <link rel="preconnect" href="https://yt3.ggpht.com">
  <title>MPEG-YT</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body data-guide="full">
  <header id="masthead">
    <div class="mh-start">
      <button id="guide-btn" class="icon-btn" type="button" aria-label="Guide">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
      </button>
      <a class="logo" href="/" aria-label="MPEG-YT home">
        <img src="/logo.svg" alt="" width="29" height="20">
        <span class="logo-text">MPEG<span>-YT</span></span>
      </a>
    </div>
    <div class="mh-center">
      <button id="search-back" class="icon-btn" type="button" aria-label="Back">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <form id="search" role="search" autocomplete="off">
        <div class="search-box">
          <input id="q" type="text" placeholder="Search" aria-label="Search" spellcheck="false" enterkeyhint="search" autocapitalize="off">
          <button id="q-clear" class="icon-btn small" type="button" aria-label="Clear search" hidden>
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
          </button>
        </div>
        <button class="search-btn" type="submit" aria-label="Search">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        </button>
        <ul id="suggest" class="suggest" role="listbox" hidden></ul>
      </form>
      <button id="voice" class="icon-btn filled" type="button" aria-label="Search with your voice" hidden>
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
      </button>
    </div>
    <div class="mh-end">
      <button id="search-open" class="icon-btn" type="button" aria-label="Search">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      </button>
      <div id="account-slot" class="account-slot"></div>
    </div>
  </header>

  <nav id="mini-guide" aria-label="Navigation"></nav>
  <nav id="guide" aria-label="Guide"></nav>
  <div id="scrim" hidden></div>

  <main id="view" tabindex="-1"></main>

  <!-- JSMpeg: MPEG-TS demuxer, MPEG-1/MP2 decoders (WASM), WebGL renderer, WebAudio out -->
  <script src="/vendor/jsmpeg.min.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
